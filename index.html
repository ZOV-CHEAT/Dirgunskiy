<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Дыргунский Переводчик</title>
<style>
body {
    font-family: 'Courier New', Courier, monospace;
    background-color: #1a0a0a;
    color: #e2e2e2;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    margin: 0;
    padding: 20px;
    box-sizing: border-box;
}
.container {
    background-color: #2b0f0f;
    padding: 30px;
    border-radius: 16px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
    width: 100%;
    max-width: 650px;
    border: 1px solid #7a1f1f;
}
h1, h2 {
    text-align: center;
    color: #ff4d4d;
    margin-top: 0;
    text-transform: uppercase;
    letter-spacing: 2px;
}
h2 {
    font-size: 20px;
    margin-top: 40px;
    border-top: 1px dashed #7a1f1f;
    padding-top: 30px;
}
label {
    font-weight: bold;
    display: block;
    margin-bottom: 8px;
    color: #ff9999;
}
textarea {
    width: 100%;
    height: 100px;
    padding: 12px;
    border: 2px solid #5a1616;
    border-radius: 8px;
    background-color: #1f0b0b;
    color: #fff;
    resize: vertical;
    font-size: 16px;
    box-sizing: border-box;
    transition: all 0.3s;
}
textarea:focus {
    border-color: #ff4d4d;
    outline: none;
    box-shadow: 0 0 8px rgba(255, 77, 77, 0.5);
}
.output-box {
    margin-top: 15px;
    background-color: #1f0b0b;
    padding: 15px;
    border-radius: 8px;
    min-height: 60px;
    border-left: 5px solid #ff4d4d;
    word-wrap: break-word;
    font-size: 18px;
    color: #ff8080;
}
</style>
</head>
<body>

<div class="container">
    <h1>Дыргунский переводчик 🔴</h1>

    <label for="encryptInput">Русский текст:</label>
    <textarea id="encryptInput" placeholder="Введите текст..."></textarea>

    <label style="margin-top: 15px;">Результат:</label>
    <div id="encryptOutput" class="output-box">...</div>

    <h2>Расшифрователь 🩸</h2>

    <label for="decryptInput">Дыргунский текст:</label>
    <textarea id="decryptInput" placeholder="Введите текст..."></textarea>

    <label style="margin-top: 15px;">Результат:</label>
    <div id="decryptOutput" class="output-box">...</div>
</div>

<script>
    const vowels = "аеёиоуыэюяАЕЁИОУЫЭЮЯ";

    function isConsonant(ch) {
        return /[а-яё]/i.test(ch) && !vowels.includes(ch);
    }

    function toDyrgun(text) {
        let result = '';
        for (let i = 0; i < text.length; i++) {
            const ch = text[i];
            const lower = ch.toLowerCase();
            const isUpper = ch !== lower;
            let out = ch;

            if (lower === 'е') {
                out = isUpper ? 'Ї' : 'ї';
            } else if (lower === 'ё') {
                out = (isUpper ? 'Ї' : 'ї') + '\u0308';
            } else if (lower === 'и') {
                out = (isUpper ? 'Ї' : 'ї') + '\u0307';
            } else if (lower === 'й') {
                out = (isUpper ? 'Ї' : 'ї') + '\u030A';
            } else if (lower === 'п' || lower === 'т') {
                const next = text[i + 1] ? text[i + 1].toLowerCase() : '';
                if (next === 'ь' || next === 'ъ') {
                    const base = isUpper ? 'Ц' : 'ц';
                    const mark = lower === 'т' ? '\u0307' : '';
                    out = base + mark + text[i + 1];
                    i++;
                } else {
                    out = (isUpper ? 'Т' : 'т') + (lower === 'т' ? '\u0307' : '');
                }
            } else if (lower === 'ц') {
                out = (isUpper ? 'Ц' : 'ц') + '\u0308';
            } else if (lower === 'с') {
                out = isUpper ? 'З' : 'з';
            } else if (lower === 'з') {
                out = (isUpper ? 'З' : 'з') + '\u0308';
            } else if (lower === 'к') {
                out = isUpper ? 'Г' : 'г';
            } else if (lower === 'г') {
                out = (isUpper ? 'Г' : 'г') + '\u0307';
            } else if (lower === 'д') {
                out = isUpper ? 'Дз' : 'дз';
            } else if (lower === 'л') {
                out = isUpper ? 'Ль' : 'ль';
            } else if (lower === 'а') {
                out = (isUpper ? 'О' : 'о') + '\u0307';
            } else if (lower === 'о') {
                out = isUpper ? 'О' : 'о';
            } else if (lower === 'у') {
                let prev = '';
                for (let j = i - 1; j >= 0; j--) {
                    if (text[j].trim() !== '') {
                        prev = text[j];
                        break;
                    }
                }
                if (prev && isConsonant(prev)) {
                    out = isUpper ? 'Ў' : 'ў';
                }
            } else if (lower === 'ў') {
                out = (isUpper ? 'Ў' : 'ў') + '\u0307';
            }

            result += out;
        }
        return result;
    }

    function fromDyrgun(text) {
        let result = '';
        for (let i = 0; i < text.length; i++) {
            const ch = text[i];
            const lower = ch.toLowerCase();
            const isUpper = ch !== lower;

            let out = ch;

            if (ch === 'Ї' || ch === 'ї') {
                const next = text[i + 1];
                if (next === '\u0308') {
                    out = isUpper ? 'Ё' : 'ё';
                    i++;
                } else if (next === '\u0307') {
                    out = isUpper ? 'И' : 'и';
                    i++;
                } else if (next === '\u030A') {
                    out = isUpper ? 'Й' : 'й';
                    i++;
                } else {
                    out = isUpper ? 'Е' : 'е';
                }
            } else if (ch === 'О' || ch === 'о') {
                const next = text[i + 1];
                if (next === '\u0307') {
                    out = isUpper ? 'А' : 'а';
                    i++;
                } else {
                    out = isUpper ? 'О' : 'о';
                }
            } else if (ch === 'Т' || ch === 'т') {
                const next = text[i + 1];
                if (next === '\u0307') {
                    out = isUpper ? 'Т' : 'т';
                    i++;
                } else {
                    out = isUpper ? 'П' : 'п';
                }
            } else if (ch === 'Ц' || ch === 'ц') {
                const next = text[i + 1];
                if (next === '\u0308') {
                    out = isUpper ? 'Ц' : 'ц';
                    i++;
                } else if (next === '\u0307') {
                    out = isUpper ? 'Т' : 'т';
                    i++;
                } else {
                    out = isUpper ? 'П' : 'п';
                }
            } else if (ch === 'З' || ch === 'з') {
                const next = text[i + 1];
                if (next === '\u0308') {
                    out = isUpper ? 'З' : 'з';
                    i++;
                } else {
                    out = isUpper ? 'С' : 'с';
                }
            } else if (ch === 'Г' || ch === 'г') {
                const next = text[i + 1];
                if (next === '\u0307') {
                    out = isUpper ? 'Г' : 'г';
                    i++;
                } else {
                    out = isUpper ? 'К' : 'к';
                }
            } else if ((ch === 'Д' || ch === 'д') && text[i + 1] && text[i + 1].toLowerCase() === 'з') {
                out = isUpper ? 'Д' : 'д';
                i++;
            } else if (ch === 'Ў' || ch === 'ў') {
                const next = text[i + 1];
                if (next === '\u0307') {
                    out = isUpper ? 'Ў' : 'ў';
                    i++;
                } else {
                    out = isUpper ? 'У' : 'у';
                }
            } else if (lower === 'л' && text[i + 1] && text[i + 1].toLowerCase() === 'ь') {
                out = isUpper ? 'Л' : 'л';
                i++;
            }

            result += out;
        }
        return result;
    }

    const encIn = document.getElementById('encryptInput');
    const encOut = document.getElementById('encryptOutput');
    const decIn = document.getElementById('decryptInput');
    const decOut = document.getElementById('decryptOutput');

    encIn.addEventListener('input', () => {
        const v = encIn.value;
        if (!v.trim()) { encOut.innerText = '...'; return; }
        encOut.innerText = toDyrgun(v);
    });

    decIn.addEventListener('input', () => {
        const v = decIn.value;
        if (!v.trim()) { decOut.innerText = '...'; return; }
        decOut.innerText = fromDyrgun(v);
    });
</script>

</body>
</html>
